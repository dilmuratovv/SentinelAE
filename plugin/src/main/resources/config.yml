# SentinelAE: what a player could not see is not sent to them, so ESP, tracers, radar and base finders have nothing
# to draw behind walls.

# ---------------------------------------------------------------- entities
# Groups of entities that are only sent while in line of sight: players, armor-stands, item-frames, hanging
# (paintings, frames, leash knots), vehicles (boats, minecarts incl. chest minecarts, horses, pigs...), projectiles
# (arrows, tridents, pearls, fireworks, fishing hooks), pets (wolves, cats, parrots, horses...), items (dropped
# items), villagers, mobs (every mob: costly on servers with big farms).
protected: [players, armor-stands, item-frames, hanging, vehicles, projectiles, pets, items, villagers]
# Extra single entity types (names as in Bukkit's EntityType).
protected-types: []

# Subjects farther than this (blocks) are never concealed. Paper's player tracking range is 128 by default.
max-distance: 128

# Lag tolerance: a subject is revealed when it, or where it will be in this many ticks, or this much wider, could be
# seen. The viewer's ping adds up to max-ping-lookahead-ticks more (ping / 50 ms), so high-ping players see
# enemies in time.
lookahead-ticks: 3
max-ping-lookahead-ticks: 6
box-margin: 0.25

# A visible subject is concealed only after this many consecutive blocked checks (prevents flicker at edges).
conceal-after-checks: 2

# Work limits per server tick. Players are checked first; other subjects share secondary-share of the budget.
# A concealed player whose check is fail-open-ticks late is shown (never an invisible attacker under load).
pairs-per-tick: 768
max-micros-per-tick: 2500
secondary-share: 0.4
fail-open-ticks: 4

# Armor stands used as holograms (custom name shown, marker or invisible) are never concealed.
skip-holograms: true

# Full blocks that should not hide anything (players can see through or past them).
transparent-blocks: [BARRIER, LIGHT, STRUCTURE_VOID]

# ---------------------------------------------------------------- storage blocks (base finders, storage ESP)
storage-esp:
  # Storage blocks arrive as air (full blocks as stone) in chunk data and block updates, and are sent for real once
  # the player has line of sight to one of their faces within reveal-distance. Their open/close animations and
  # sounds stay hidden too.
  enabled: true
  reveal-distance: 48
  # Hidden blocks near a player are re-checked every this many ticks (new chunks and new blocks at once).
  check-ticks: 3
  max-micros-per-tick: 1500
  # A revealed block that has been out of sight this long (and is more than 16 blocks away) is hidden again, so an
  # ESP that keeps no record of its own loses it (0 = never).
  rehide-after-ticks: 200
  blocks: [CHEST, TRAPPED_CHEST, BARREL, ENDER_CHEST, SHULKER_BOX, WHITE_SHULKER_BOX, ORANGE_SHULKER_BOX,
           MAGENTA_SHULKER_BOX, LIGHT_BLUE_SHULKER_BOX, YELLOW_SHULKER_BOX, LIME_SHULKER_BOX, PINK_SHULKER_BOX,
           GRAY_SHULKER_BOX, LIGHT_GRAY_SHULKER_BOX, CYAN_SHULKER_BOX, PURPLE_SHULKER_BOX, BLUE_SHULKER_BOX,
           BROWN_SHULKER_BOX, GREEN_SHULKER_BOX, RED_SHULKER_BOX, BLACK_SHULKER_BOX, HOPPER, DROPPER, DISPENSER,
           FURNACE, BLAST_FURNACE, SMOKER, BREWING_STAND, SPAWNER, CRAFTER, BEACON, DECORATED_POT, CHISELED_BOOKSHELF,
           JUKEBOX, LECTERN]

# ---------------------------------------------------------------- sounds and particles (sound ESP)
# Sounds, particles and block-break animations coming from a concealed subject (footsteps, eating, attacks, mining)
# are not sent to the players it is concealed from.
hide-sounds: true

# auto: use Paper's tracker directly (nothing about a concealed entity is sent, tab list untouched) and fall back
# to the public hide/show API when that is unavailable. api: always use hide/show (concealed players then leave
# the tab list). Changing it needs a restart.
tracker-mode: auto

# Log every conceal/reveal decision (very verbose; for troubleshooting only).
debug: false
